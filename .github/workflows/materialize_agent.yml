name: Materialize exact V2-6 Agent

on:
  workflow_dispatch:
  push:
    paths:
      - ".bootstrap/agent.part*"
      - ".github/workflows/materialize_agent.yml"

permissions:
  contents: write

jobs:
  materialize-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify Agent
        shell: python
        run: |
          import base64
          import hashlib
          import lzma
          import pathlib
          import subprocess

          chunks = sorted(pathlib.Path('.bootstrap').glob('agent.part*'))
          if not chunks:
              raise RuntimeError('No Agent bootstrap chunks found')
          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in chunks)
          raw = lzma.decompress(base64.b64decode(encoded))
          expected_sha256 = 'a8f00803b610d3f159ed3e7667d75d9172e888f643e4cbc62c870674a4463f4d'
          expected_size = 42949
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected_sha256 or len(raw) != expected_size:
              raise RuntimeError(f'Agent verification failed: size={len(raw)} sha256={actual}')
          pathlib.Path('NERO_V2_6_Agent.py').write_bytes(raw)
          subprocess.run([
              'python3','-m','py_compile',
              'NERO_V2_6_Agent.py',
              'NERO_V2_6_Unified_Backend.py',
              'NERO_V69_ReachableZone_BioIK_Planner_Core.py'
          ], check=True)
          print(f'VERIFIED NERO_V2_6_Agent.py: {len(raw)} bytes SHA256={actual}')
          print('PY_COMPILE_OK')

      - name: Commit verified Agent
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NERO_V2_6_Agent.py
          if git diff --cached --quiet; then
            echo "Agent already exact; nothing to commit."
            exit 0
          fi
          git commit -m "Restore exact validated V2-6 Agent"
          git push

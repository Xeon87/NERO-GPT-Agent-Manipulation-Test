name: Materialize exact V2-6 sources

on:
  workflow_dispatch:
  push:
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap_sources.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify exact source files
        shell: python
        run: |
          import base64
          import hashlib
          import lzma
          import pathlib
          import subprocess

          root = pathlib.Path(".")
          specs = [
              (
                  "backend",
                  pathlib.Path("NERO_V2_6_Unified_Backend.py"),
                  "8edc1012f2a1b51a04a60483b6331923b7a02265ea31389566eecd101b18d9c1",
                  262606,
              ),
              (
                  "core",
                  pathlib.Path("NERO_V69_ReachableZone_BioIK_Planner_Core.py"),
                  "3afc191590aa7a6959f23fac524f7901145fe5d838532d41dd25ea47c462f4b7",
                  111989,
              ),
          ]

          for prefix, destination, expected_sha256, expected_size in specs:
              chunks = sorted((root / ".bootstrap").glob(f"{prefix}.part*"))
              if not chunks:
                  raise RuntimeError(f"No bootstrap chunks found for {prefix}")
              encoded = "".join(p.read_text(encoding="utf-8").strip() for p in chunks)
              raw = lzma.decompress(base64.b64decode(encoded))
              actual_sha256 = hashlib.sha256(raw).hexdigest()
              if actual_sha256 != expected_sha256:
                  raise RuntimeError(
                      f"{prefix} SHA256 mismatch: {actual_sha256} != {expected_sha256}"
                  )
              if len(raw) != expected_size:
                  raise RuntimeError(
                      f"{prefix} size mismatch: {len(raw)} != {expected_size}"
                  )
              destination.write_bytes(raw)
              print(f"VERIFIED {destination}: {len(raw)} bytes SHA256={actual_sha256}")

          subprocess.run(
              [
                  "python3",
                  "-m",
                  "py_compile",
                  "NERO_V2_6_Agent.py",
                  "NERO_V2_6_Unified_Backend.py",
                  "NERO_V69_ReachableZone_BioIK_Planner_Core.py",
              ],
              check=True,
          )
          print("PY_COMPILE_OK")

      - name: Commit verified source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NERO_V2_6_Unified_Backend.py NERO_V69_ReachableZone_BioIK_Planner_Core.py
          if git diff --cached --quiet; then
            echo "Exact sources already materialized; nothing to commit."
            exit 0
          fi
          git commit -m "Materialize verified V2-6 backend and frozen V69 core"
          git push

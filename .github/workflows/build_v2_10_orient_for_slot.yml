name: Build NERO V2-10 orient_for_slot staged transfer

on:
  push:
    branches:
      - v2-10-orient-for-slot-staged-transfer
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Seed V2-6 and normalize historical packaging typo
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/v26
          cp NERO_V2_6_Unified_Backend.py NERO_V2_6_Agent.py \
             NERO_V69_ReachableZone_BioIK_Planner_Core.py start_nero_v2_6.sh build/v26/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/upgrade_v2_6_egg_to_v2_7.py')
          s = p.read_text(encoding='utf-8')
          old = '        """# NERO V2-7 — Constraint-Aware Grasp Planning\\n\\n"\n'
          new = '        "# NERO V2-7 — Constraint-Aware Grasp Planning\\n\\n"\n'
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Rebuild exact V2-7.2 baseline then V2-9
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/upgrade_v2_6_egg_to_v2_7.py build/v26 --output-dir build/v27
          python3 tools/upgrade_v2_7_to_v2_7_1.py build/v27 --output-dir build/v271
          python3 tools/run_v2_7_2_patch.py build/v271 --output-dir build/v272
          python3 tools/apply_v2_9_log_summary.py build/v272
          cp build/v272/NERO_V2_7_1_Unified_Backend.py build/v29_backend.py
          cp build/v272/NERO_V2_7_1_Agent.py build/v29_agent.py
          cp build/v272/NERO_V69_ReachableZone_BioIK_Planner_Core.py build/v29_v69.py
          cp build/v272/start_nero_v2_7_2.sh build/v29_launcher.sh

      - name: Apply ONLY V2-10 orient_for_slot patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_v2_10_orient_for_slot.py build/v272

      - name: Prove Agent V69 launcher startup stack unchanged from V2-9
        shell: bash
        run: |
          set -euo pipefail
          cmp build/v29_agent.py build/v272/NERO_V2_7_1_Agent.py
          cmp build/v29_v69.py build/v272/NERO_V69_ReachableZone_BioIK_Planner_Core.py
          cmp build/v29_launcher.sh build/v272/start_nero_v2_7_2.sh
          python3 - <<'PY'
          from pathlib import Path
          import ast
          old = Path('build/v29_backend.py').read_text(encoding='utf-8')
          new = Path('build/v272/NERO_V2_7_1_Unified_Backend.py').read_text(encoding='utf-8')
          def fn_src(src, name):
              tree = ast.parse(src)
              lines = src.splitlines()
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == name:
                      return '\n'.join(lines[node.lineno-1:node.end_lineno])
              raise RuntimeError(name)
          assert fn_src(old, 'run_sim') == fn_src(new, 'run_sim'), 'MuJoCo run_sim changed'
          for key in ('mujoco.viewer.launch_passive','mp.Process','rclpy.init','rclpy.shutdown','sim_ready'):
              a=[x.strip() for x in old.splitlines() if key in x]
              b=[x.strip() for x in new.splitlines() if key in x]
              assert a == b, key
          print('[OK] MuJoCo / multiprocessing / ROS startup unchanged from V2-9')
          PY

      - name: Prove backend delta is limited to V2-10 orient transfer
        shell: bash
        run: |
          set -euo pipefail
          diff -u build/v29_backend.py build/v272/NERO_V2_7_1_Unified_Backend.py > build/v210.diff || true
          cat build/v210.diff
          test "$(grep -c '^@@' build/v210.diff)" -le 2
          grep -q 'V2-10 ORIENT TRANSFER' build/v210.diff
          grep -q 'v210_orient_vertical_clearance' build/v210.diff
          grep -q 'v210_orient_high_transfer_' build/v210.diff
          grep -q 'max_xy_step_m = 0.045' build/v210.diff
          # The original Step-B bounded wrist executor and all later placement handlers stay present.
          grep -q '_v272_execute_wrist_bounded_pose' build/v272/NERO_V2_7_1_Unified_Backend.py
          grep -q 'if name == "move_to_slot_entry"' build/v272/NERO_V2_7_1_Unified_Backend.py
          grep -q 'if name == "guarded_insert_and_release"' build/v272/NERO_V2_7_1_Unified_Backend.py

      - name: Syntax and frozen checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            build/v272/NERO_V2_7_1_Unified_Backend.py \
            build/v272/NERO_V2_7_1_Agent.py \
            build/v272/NERO_V69_ReachableZone_BioIK_Planner_Core.py \
            tools/apply_v2_9_log_summary.py \
            tools/apply_v2_10_orient_for_slot.py
          bash -n start_nero_v2_10.sh
          bash -n build/v272/start_nero_v2_7_2.sh
          test "$(sha256sum build/v272/NERO_V69_ReachableZone_BioIK_Planner_Core.py | awk '{print $1}')" = \
            "3afc191590aa7a6959f23fac524f7901145fe5d838532d41dd25ea47c462f4b7"

      - name: Static test staged transfer geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import math
          # Reproduce the exact observed V2-9 failure geometry from the user log.
          tcp=(-0.42457,-0.15071,0.21609)
          safe=(-0.4225,0.0,0.29704)
          d=math.hypot(safe[0]-tcp[0], safe[1]-tcp[1])
          n=max(1, int(math.ceil(d/0.045)))
          assert n == 4, (d,n)
          pts=[]
          for i in range(1,n+1):
              f=i/n
              p=(tcp[0]+f*(safe[0]-tcp[0]), tcp[1]+f*(safe[1]-tcp[1]), safe[2])
              pts.append(p)
          prev=(tcp[0],tcp[1],safe[2])
          for p in pts:
              assert math.hypot(p[0]-prev[0], p[1]-prev[1]) <= 0.0450001
              prev=p
          assert max(abs(pts[-1][j]-safe[j]) for j in range(3)) < 1e-9
          print('[OK] observed 151mm lateral transfer decomposes into 4 <=45mm high-Z segments')
          PY

      - name: Build distributable package
        shell: bash
        run: |
          set -euo pipefail
          PKG=build/NERO_V2_10_OrientForSlot_StagedTransfer
          rm -rf "$PKG"
          mkdir -p "$PKG/tools"
          cp start_nero_v2_10.sh "$PKG/"
          cp tools/apply_v2_9_log_summary.py "$PKG/tools/"
          cp tools/apply_v2_10_orient_for_slot.py "$PKG/tools/"
          cp tools/run_v2_7_2_upgrader.py "$PKG/tools/"
          cp tools/run_v2_7_2_patch.py "$PKG/tools/"
          cp tools/upgrade_v2_7_1_to_v2_7_2.py "$PKG/tools/"
          cat > "$PKG/README_V2_10.md" <<'EOF'
          # NERO V2-10

          Base: V2-9, itself rebuilt on the original V2-7.2 runtime/startup path.

          Runtime path remains:
          `~/mujoco_ws/nero/NERO_V2_7_2_Hold_Continuity_Wrist_Reorientation`

          Only behavior change vs V2-9:
          - `orient_for_slot()` Step A safe-workspace transfer.
          - First move vertically at current XY to the existing safe Z.
          - Then move at high Z to the existing safe XY in <=45 mm XY segments.
          - The original V2-7.2 bounded ~10-degree wrist reorientation then continues unchanged.

          Unchanged: Agent/orchestration, MuJoCo, runtime launcher, MoveIt/RViz startup,
          frozen V69, grasp planning, pregrasp, approach, clamp, lift, slot entry,
          guarded insert/release, verification, V2-9 log styling and task summary.
          EOF
          chmod +x "$PKG/start_nero_v2_10.sh"
          (
            cd "$PKG"
            sha256sum start_nero_v2_10.sh tools/*.py > SHA256SUMS.txt
          )
          find "$PKG" -maxdepth 2 -type f -printf '%P\n' | sort

      - uses: actions/upload-artifact@v4
        with:
          name: NERO_V2_10_OrientForSlot_StagedTransfer
          path: build/NERO_V2_10_OrientForSlot_StagedTransfer
          retention-days: 30

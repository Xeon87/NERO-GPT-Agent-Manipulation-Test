name: Build clean-room NERO V2-7.2 snapshot

on:
  push:
    branches: [v2-7-5-base-inspect]
    paths:
      - ".github/workflows/build_v2_7_2_snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Seed V2-6 and normalize historical packaging typo
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/v26
          cp NERO_V2_6_Unified_Backend.py NERO_V2_6_Agent.py NERO_V69_ReachableZone_BioIK_Planner_Core.py start_nero_v2_6.sh build/v26/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/upgrade_v2_6_egg_to_v2_7.py')
          s = p.read_text(encoding='utf-8')
          old = '        """# NERO V2-7 — Constraint-Aware Grasp Planning\\n\\n"\n'
          new = '        "# NERO V2-7 — Constraint-Aware Grasp Planning\\n\\n"\n'
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m py_compile tools/upgrade_v2_6_egg_to_v2_7.py
      - name: V2-7
        run: python3 tools/upgrade_v2_6_egg_to_v2_7.py build/v26 --output-dir build/v27
      - name: V2-7.1
        run: python3 tools/upgrade_v2_7_to_v2_7_1.py build/v27 --output-dir build/v271
      - name: V2-7.2
        run: python3 tools/run_v2_7_2_patch.py build/v271 --output-dir build/NERO_V2_7_2_Hold_Continuity_Wrist_Reorientation
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          R=build/NERO_V2_7_2_Hold_Continuity_Wrist_Reorientation
          test -f "$R/NERO_V2_7_1_Unified_Backend.py"
          test -f "$R/NERO_V2_7_1_Agent.py"
          test -f "$R/NERO_V69_ReachableZone_BioIK_Planner_Core.py"
          test -f "$R/start_nero_v2_7_2.sh"
          python3 -m py_compile "$R/NERO_V2_7_1_Unified_Backend.py" "$R/NERO_V2_7_1_Agent.py" "$R/NERO_V69_ReachableZone_BioIK_Planner_Core.py"
          bash -n "$R/start_nero_v2_7_2.sh"
          test "$(sha256sum "$R/NERO_V69_ReachableZone_BioIK_Planner_Core.py" | awk '{print $1}')" = "3afc191590aa7a6959f23fac524f7901145fe5d838532d41dd25ea47c462f4b7"
      - name: Dump exact V2-7.2 patch anchors
        shell: bash
        run: |
          set -euo pipefail
          R=build/NERO_V2_7_2_Hold_Continuity_Wrist_Reorientation
          echo '===== AGENT approach/clamp/run_task anchors ====='
          grep -n -E 'def run_task|approach_planned_grasp|clamp_gripper|LLM TASK FAILED|LLM TASK END|tool_runner\(name' "$R/NERO_V2_7_1_Agent.py" | head -n 80
          echo '===== BACKEND append_gui_log anchor ====='
          grep -n -A35 -B8 'def append_gui_log' "$R/NERO_V2_7_1_Unified_Backend.py" | head -n 90
          echo '===== LAUNCHER full ====='
          cat "$R/start_nero_v2_7_2.sh"
      - name: Upload V2-7.2 snapshot
        uses: actions/upload-artifact@v4
        with:
          name: NERO_V2_7_2_Hold_Continuity_Wrist_Reorientation
          path: build/NERO_V2_7_2_Hold_Continuity_Wrist_Reorientation
          if-no-files-found: error
          retention-days: 7
